# 保護ファイル: .github/workflows/ の変更は代表の承認必須。自己改修の対象外。
#
# サブスク実行 (Routines) への変換により、LLM系ステップ (発案→リサーチ→生成→SEO監視) は
# 日次ルーチン (claude.ai/code/routines、scripts/jobs/routine_daily.ts) 側で実行する。
# ここでは DAILY_LLM_STEPS=off でスキップし、計測と安全装置だけを担う。
# ルーチンが止まっても tripwire/deadman は独立に動き続ける。docs/ROUTINES.md 参照。
#
# GSC同期 → 順位監視 → トリップワイヤ → デッドマンスイープ。
# 生成はルーチン側でも承認キューで止まり、このジョブは記事を公開しない (絶対ルール)。
name: cron-daily (metrics + tripwire)

on:
  schedule:
    - cron: "0 21 * * *" # JST 6:00
  workflow_dispatch:

concurrency:
  group: cron-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 日次ジョブ実行 (計測 + 安全装置)
        env:
          PIPELINE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # 順位監視 (rank_watch) が使う。未登録ならスキップされる
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # LLM系ステップは日次ルーチン (サブスク実行) 側で走らせるためここでは切る
          DAILY_LLM_STEPS: "off"
        run: npx tsx scripts/jobs/cron_daily.ts
